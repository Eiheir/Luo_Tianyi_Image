name: Deploy images to Workers

# 图床图片 → Cloudflare Workers Static Assets 自动部署
#
# 只处理 LTYpicture/** 下的图片文件；manager/（图床管理软件）、README、
# config.json 等仓库代码不参与部署。
#
# Worker 骨架（wrangler.toml + src/index.js）维护在博客仓库
# XinChengP/OxygenBlogPlatform 的 cloudflare/gallery-assets/，
# 本工作流每次部署时拉取最新骨架，单一事实来源。
#
# 首次启用前需在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN  : API Token（模板 "Edit Cloudflare Workers"，限定本账号/zone）
#   CLOUDFLARE_ACCOUNT_ID : Cloudflare 账号 ID（仪表盘右栏）
#   BLOG_REPO_TOKEN（可选）: 默认 GITHUB_TOKEN 即可读公开仓库；博客仓库转私后才需要

on:
  push:
    branches: [main]
    paths:
      - 'LTYpicture/**' # 只有图片目录变化才跑，改 manager 等代码不触发
  workflow_dispatch: # 保留手动触发入口，用于补部署

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image repo
        uses: actions/checkout@v4

      - name: Fetch worker skeleton from blog repo
        # 拉取博客仓库里的 Worker 骨架（wrangler.toml + 部署辅助脚本）。
        # GitHub API 的 tarball 接口不支持按子目录过滤（返回整仓库归档），
        # 直接用稀疏检出只取 cloudflare/gallery-assets/。
        # 注：首跑（2026-10-17）失败是因为当时博客仓库尚未推入该目录，
        # 时序问题而非脚本问题；骨架目录缺失时这里会明确报错提示。
        run: |
          mkdir -p worker
          git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${{ github.token }}@github.com/XinChengP/OxygenBlogPlatform.git blog-repo
          git -C blog-repo sparse-checkout set cloudflare/gallery-assets
          if [ ! -f blog-repo/cloudflare/gallery-assets/wrangler.toml ]; then
            echo "博客仓库未找到 cloudflare/gallery-assets/wrangler.toml，请先在 XinChengP/OxygenBlogPlatform 推入 Worker 骨架" >&2
            exit 1
          fi
          cp -r blog-repo/cloudflare/gallery-assets/. worker/
          rm -rf blog-repo
          ls -la worker/

      - name: Generate manifest and stage assets
        # 从 checkout 的 LTYpicture 目录生成图片清单（画廊浏览器端数据源），
        # 并把图片平铺进 Worker 的 assets 目录
        run: |
          mkdir -p worker/assets
          node -e '
            const fs = require("fs"), path = require("path");
            const exts = [".jpg",".jpeg",".png",".gif",".webp",".avif"];
            const images = [];
            const walk = (dir) => {
              for (const name of fs.readdirSync(dir)) {
                const full = path.join(dir, name);
                if (fs.statSync(full).isDirectory()) walk(full);
                else if (exts.includes(path.extname(name).toLowerCase()))
                  images.push({ path: "LTYpicture/" + path.relative("LTYpicture", full).split(path.sep).join("/"), size: fs.statSync(full).size });
              }
            };
            walk("LTYpicture");
            fs.writeFileSync("worker/assets/manifest.json", JSON.stringify({
              generatedAt: new Date().toISOString(), count: images.length, images
            }));
            console.log("manifest:", images.length, "images");
          '
          cp -r LTYpicture worker/assets/LTYpicture

      - name: Deploy Worker with assets
        # wrangler-action@v3 在部分环境下 npx 拉包需要交互确认，改为显式安装后直接调用
        run: |
          cd worker
          npm install --no-save wrangler@^4
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}