name: Deploy images to Workers

# 图床图片 → Cloudflare Workers Static Assets 自动部署
#
# 只处理 LTYpicture/** 下的图片文件；manager/（图床管理软件）、README、
# config.json 等仓库代码不参与部署。
#
# Worker 配置（wrangler.toml）维护在博客仓库 XinChengP/OxygenBlogPlatform 的
# cloudflare/gallery-assets/，本工作流每次部署时拉取，单一事实来源。
#
# 缩略图/高清预览图构建脚本与 _headers 在 scripts/gallery-assets/ 留了一份
# CI 副本：博客仓库的 assets/ 被 gitignore（_headers 无法进入 CI 检出），
# 且 Action 需要固定的 --large-width 行为，不能依赖博客仓库工作区的未提交改动。
# 博客仓库的 cloudflare/gallery-assets/build-manifest.mjs 变更后，请同步本副本。
#
# 首次启用前需在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN  : API Token（模板 "Edit Cloudflare Workers"，限定本账号/zone）
#   CLOUDFLARE_ACCOUNT_ID : Cloudflare 账号 ID（仪表盘右栏）

on:
  push:
    branches: [main]
    paths:
      - 'LTYpicture/**' # 只有图片目录变化才跑，改 manager 等代码不触发
  workflow_dispatch: # 保留手动触发入口，用于补部署

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sharp
        # build-manifest.mjs 生成缩略图/高清预览图依赖 sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Fetch worker skeleton from blog repo
        # 拉取博客仓库里的 Worker 配置；GitHub API 的 tarball 接口不支持按子目录
        # 过滤，直接用稀疏检出只取 cloudflare/gallery-assets/。
        run: |
          mkdir -p worker
          git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${{ github.token }}@github.com/XinChengP/OxygenBlogPlatform.git blog-repo
          git -C blog-repo sparse-checkout set cloudflare/gallery-assets
          if [ ! -f blog-repo/cloudflare/gallery-assets/wrangler.toml ]; then
            echo "博客仓库未找到 cloudflare/gallery-assets/wrangler.toml，请先在 XinChengP/OxygenBlogPlatform 推入 Worker 骨架" >&2
            exit 1
          fi
          cp -r blog-repo/cloudflare/gallery-assets/. worker/
          rm -rf blog-repo
          ls -la worker/

      - name: Generate thumbs, large previews and manifest
        # 原图平铺进 Worker assets，再用 build-manifest.mjs 生成：
        #   thumbs/**  640 宽 WebP（网格卡片）
        #   large/**   1600 宽 WebP（灯箱高清，避免直接拉十几 MB 原图）
        #   manifest.json（含 path/size/width/height/thumb/large）
        #
        # 优先使用博客骨架里的脚本/_headers（单一事实来源）；骨架版本还不支持
        # --large-width 或缺少 _headers 时，退回本仓库 scripts/gallery-assets/ 的副本。
        run: |
          BUILD_SCRIPT=scripts/gallery-assets/build-manifest.mjs
          if grep -q -- '--large-width' worker/build-manifest.mjs 2>/dev/null; then
            BUILD_SCRIPT=worker/build-manifest.mjs
            echo "使用博客仓库骨架中的 build-manifest.mjs"
          else
            echo "博客骨架版本不支持 --large-width，使用本仓库 CI 副本"
          fi

          mkdir -p worker/assets/LTYpicture
          cp -r LTYpicture/. worker/assets/LTYpicture/
          # Workers 单文件上限 25MiB：现场压缩超限原图，否则 wrangler 会拒绝部署
          node scripts/gallery-assets/compress-oversized-ci.mjs --root worker/assets
          node "$BUILD_SCRIPT" \
            --root worker/assets \
            --out worker/assets \
            --large-width 1600

          if [ ! -f worker/assets/_headers ] || ! grep -q '/large/' worker/assets/_headers; then
            cp scripts/gallery-assets/_headers worker/assets/_headers
          fi

      - name: Validate manifest completeness
        # 画廊卡片只认 thumb，灯箱优先 large；静图必须 thumb/large/宽高齐全。
        # 动图（GIF/APNG/动态 WebP）按设计不生成 large，灯箱回退原文件以保留动画，
        # 因此校验时排除带 animated 标记或 .gif 后缀的条目。
        run: |
          node -e '
            const m = require("./worker/assets/manifest.json");
            const isAnimated = (x) => x.animated === true || /\.gif$/i.test(x.path);
            const noThumb = m.images.filter((x) => !x.thumb).length;
            const noLarge = m.images.filter((x) => !x.large && !isAnimated(x)).length;
            const noSize = m.images.filter((x) => !x.width || !x.height).length;
            const animated = m.images.filter(isAnimated).length;
            const countMismatch = m.count !== m.images.length;
            console.log({ count: m.count, images: m.images.length, noThumb, noLarge, noSize, animated, countMismatch });
            if (!m.count || countMismatch || noThumb || noLarge || noSize) {
              const bad = m.images
                .filter((x) => !x.thumb || (!x.large && !isAnimated(x)) || !x.width || !x.height)
                .slice(0, 10)
                .map((x) => x.path);
              console.error("manifest 字段不完整，中止部署：", bad);
              process.exit(1);
            }
          '

      - name: Deploy Worker with assets
        # wrangler-action@v3 在部分环境下 npx 拉包需要交互确认，改为显式安装后直接调用
        run: |
          cd worker
          npm install --no-save wrangler@^4
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
